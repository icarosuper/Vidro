# Each linter here is a rule that was already written in docs/agents/conventions.md and
# became a red build. Prose in a .md the agent may not read; this it cannot escape.
# Pattern imported from mamut-api (see ../docs/patterns-to-import.md, item 1).
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    # conventions.md: fmt.Errorf("context: %w", err), never %v
    - errorlint
    # "a non-critical error is swallowed on purpose" — nilerr catches the `return nil` with a
    # live err that was NOT on purpose
    - nilerr
    # config only in config/config.go; injected clock (root rule, item 11)
    - forbidigo
    # architectural boundaries: zerolog in the worker, pipeline steps without external I/O
    - depguard
    # FIXME/HACK/XXX banned, TODO allowed — see settings
    - godox
    # every external call carries a context and closes the body
    - noctx
    - bodyclose
    - contextcheck
    # the job's context has to reach Redis and MinIO: without it, running out of budget or
    # receiving SIGTERM does not cancel a 500 MB download
    # cheap and uncontroversial
    - copyloopvar
    - intrange
    - unconvert
    - durationcheck
    - errname
    - usestdlibvars
    - nolintlint
  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        # Close on an already finished read/write: the error changes no decision, and
        # checking it in a defer only spreads `_ =` everywhere.
        - (io.Closer).Close
        - (*os.File).Close
        - (*github.com/minio/minio-go/v7.Object).Close
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: "^os\\.Getenv$"
          msg: "env vars only in config/config.go, with notEmpty/envDefault — see conventions.md"
        - pattern: "^time\\.Now$"
          msg: "time is injected, not read in the middle of a method (root CLAUDE.md)"
    godox:
      # TODO is allowed on purpose: planned work marked on the code line does not drift like
      # an external doc item — and "just leave a TODO" is one of the three options of the
      # root CLAUDE.md's "bad code along the way" rule. FIXME/HACK/XXX stay banned: they
      # signal wrong code that shipped as is, and that needs a justification.
      keywords:
        - FIXME
        - HACK
        - XXX
    nolintlint:
      # require-specific: a `//nolint` without a linter turns everything off on that line.
      # allow-unused: a directive that suppresses nothing is a sign the code changed.
      # require-explanation stays off: the repo's test directives are all the same case
      # ("the error does not matter here"), and requiring a reason on each only adds noise.
      require-explanation: false
      require-specific: true
      allow-unused: false
    depguard:
      rules:
        structured-logging-in-the-worker:
          list-mode: lax
          files:
            - "$all"
            - "!**/config/config.go"
          deny:
            - pkg: log
              desc: "the worker logs with zerolog (github.com/rs/zerolog/log); the stdlib log only in config/config.go, which runs before the logger exists"
        pipeline-steps-do-not-talk-to-the-world:
          files:
            - "**/internal/processor/processor-steps/**"
          deny:
            - pkg: video-processor/minio
              desc: "a pipeline step receives a file path; MinIO belongs to main.go, behind a circuit breaker"
            - pkg: video-processor/queue
              desc: "a pipeline step does not know the queue; main.go orchestrates"
            - pkg: github.com/redis/go-redis
              desc: "a pipeline step does not talk to Redis; the queue lives in queue/, behind a circuit breaker"
            - pkg: github.com/minio/minio-go
              desc: "a pipeline step does not talk to MinIO; storage lives in minio/, behind a circuit breaker"
  exclusions:
    rules:
      # The clock: banned where the decision lives, allowed where time enters the system
      # (queue state, metrics, step duration measurement).
      - path-except: internal/processor/processor-steps/
        linters:
          - forbidigo
        text: "time\\.Now"
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - noctx
          - errorlint
          - forbidigo

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: video-processor
    goimports:
      # std / third-party / video-processor — the three groups the code already used.
      # gci would do the same, but it fights gofumpt over the same file: the two undo each
      # other in `golangci-lint fmt` and the lint never goes green.
      local-prefixes:
        - video-processor
