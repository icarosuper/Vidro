# Whole Vidro stack: infra + the three services + observability.
#
#   docker compose up -d --build
#
#   front       http://localhost:3000
#   API         http://localhost:5000   (/health, /openapi/v1.json)
#   Grafana     http://localhost:3001   (admin/admin — 3000 belongs to the front)
#   MinIO       http://localhost:9001   (minioadmin/minioadmin)
#   Prometheus  http://localhost:9090
#
# Development credentials only. The API applies EF migrations at startup, so Postgres
# may start empty.
# For frontend work prefer `bun run dev` on the host (HMR) against this stack.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vidroapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Creates the bucket and points MinIO's put-notification at the API. Runs once and exits.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/videos &&
        mc admin config set local notify_webhook:vidroapi \
          endpoint=http://api:5000/webhooks/minio-upload-completed \
          auth_token=change-me-minio-upload-token &&
        mc admin service restart local --json &&
        sleep 5 &&
        mc event add local/videos arn:minio:sqs::vidroapi:webhook \
          --event put --prefix raw/

  api:
    build: ./VidroApi
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=vidroapi;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      MinIO__Endpoint: minio:9000
      # Presigned upload/download URLs are opened by the browser, which resolves the
      # published port, not the compose service name.
      MinIO__PublicEndpoint: localhost:9000
      # Callback URL handed to the worker through the job queue — resolved inside the network.
      Api__BaseUrl: http://api:5000
      # The browser calls the API from the host, so the allowed origin is the published port.
      Cors__AllowedOrigins__0: http://localhost:3000
      # Index 1 is the GrafanaLoki sink in appsettings.Development.json's Serilog:WriteTo array.
      Serilog__WriteTo__1__Args__uri: http://loki:3100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./VidroProcessor
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis:6379
      PROCESSING_REQUEST_QUEUE: video_queue
      PROCESSING_FINISHED_QUEUE: video_success_queue
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET_NAME: videos
      # Must match the API's Webhook:Secret — it verifies the HMAC on /webhooks/video-processed.
      WEBHOOK_SECRET: dev-webhook-secret
    volumes:
      - ./VidroProcessor/tmp:/tmp
    # GPU (NVENC): the default image (Alpine + ffmpeg) has no NVIDIA support.
    # To use one: install nvidia-container-toolkit, switch to an image with FFmpeg+NVENC
    # (ubuntu/cuda base or jrottenberg/ffmpeg), and add:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  front:
    build:
      context: ./VidroFront
      args:
        # Baked into the client bundle: the URL the browser uses.
        VITE_API_URL: http://localhost:5000
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      # Read at runtime by the SSR process only (see src/shared/lib/api-client.ts).
      VITE_API_URL: http://api:5000

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.0.0
    depends_on:
      - loki
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./VidroProcessor/promtail/config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./VidroProcessor/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  grafana:
    image: grafana/grafana:10.4.0
    depends_on:
      - prometheus
    # 3001, not 3000: the front owns 3000.
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./VidroProcessor/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  minio_data:
  grafana_data:
