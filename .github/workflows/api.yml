name: API

# Monorepo: each service has its own workflow with a path filter, so a commit to the front
# does not trigger a .NET build. The `on:` filter is native to GitHub Actions — no third-party
# action in between. Commits land straight on master (see CLAUDE.md), so it runs on push
# too; a PR-only trigger would almost never fire.
on:
  push:
    branches: [master]
    paths:
      - "VidroApi/**"
      - "contracts/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "VidroApi/**"
      - "contracts/**"
      - ".github/workflows/api.yml"

defaults:
  run:
    working-directory: VidroApi

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The document is versioned because VidroFront generates its request/response types from
      # it (and VidroApi.UnitTests reads it). Regenerating and diffing is what keeps a route or a
      # success body from changing unseen — the bug class of P0.1 ("4 wrong routes in the
      # features-index"). Needs ASPNETCORE_ENVIRONMENT because generation boots the host; see
      # VidroApi/openapi/README.md.
      - name: Check the OpenAPI document is up to date
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet build src/VidroApi.Api --configuration Release -p:GenerateOpenApiDocument=true
          git diff --exit-code openapi/v1.json \
            || { echo "::error::openapi/v1.json is stale. Run: ASPNETCORE_ENVIRONMENT=Development dotnet build src/VidroApi.Api -p:GenerateOpenApiDocument=true"; exit 1; }

      - name: Run unit tests
        run: dotnet test tests/VidroApi.UnitTests --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Run integration tests
        run: dotnet test tests/VidroApi.IntegrationTests --no-build --configuration Release --logger "console;verbosity=normal"
