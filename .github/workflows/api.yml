name: API

# Monorepo: cada serviço tem o seu workflow com filtro de path, para um commit no front
# não disparar build de .NET. O filtro do `on:` é nativo do GitHub Actions — não há action
# de terceiro no meio. Commits caem direto na master (ver CLAUDE.md), então roda em push
# também; um gatilho só de PR quase nunca dispararia.
on:
  push:
    branches: [master]
    paths:
      - "VidroApi/**"
      - "contracts/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "VidroApi/**"
      - "contracts/**"
      - ".github/workflows/api.yml"

defaults:
  run:
    working-directory: VidroApi

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # O documento é versionado porque é o contrato de URL que o VidroFront consome.
      # Regenerar e diffar é o que impede uma rota mudar sem ninguém ver — a classe de bug
      # do P0.1 ("4 rotas erradas no features-index"). Precisa de ASPNETCORE_ENVIRONMENT
      # porque a geração boota o host; ver VidroApi/openapi/README.md.
      - name: Check the OpenAPI document is up to date
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet build src/VidroApi.Api --configuration Release -p:GenerateOpenApiDocument=true
          git diff --exit-code openapi/v1.json \
            || { echo "::error::openapi/v1.json esta desatualizado. Rode: ASPNETCORE_ENVIRONMENT=Development dotnet build src/VidroApi.Api -p:GenerateOpenApiDocument=true"; exit 1; }

      - name: Run unit tests
        run: dotnet test tests/VidroApi.UnitTests --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Run integration tests
        run: dotnet test tests/VidroApi.IntegrationTests --no-build --configuration Release --logger "console;verbosity=normal"
