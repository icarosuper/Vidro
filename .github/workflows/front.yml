name: Front

on:
  push:
    branches: [master]
    paths:
      - "VidroFront/**"
      - "contracts/**"
      - ".github/workflows/front.yml"
  pull_request:
    paths:
      - "VidroFront/**"
      - "contracts/**"
      - ".github/workflows/front.yml"

defaults:
  run:
    working-directory: VidroFront

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
