name: Front

on:
  push:
    branches: [master]
    paths:
      - "VidroFront/**"
      - "contracts/**"
      - "VidroApi/openapi/**"
      - ".github/workflows/front.yml"
  pull_request:
    paths:
      - "VidroFront/**"
      - "contracts/**"
      - "VidroApi/openapi/**"
      - ".github/workflows/front.yml"

defaults:
  run:
    working-directory: VidroFront

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The front's types are generated from the API's committed OpenAPI document. A commit that
      # changes VidroApi/openapi/v1.json without regenerating schema.d.ts fails here.
      - name: Check generated API types
        run: |
          bun run openapi
          git diff --exit-code src/shared/api/schema.d.ts

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
