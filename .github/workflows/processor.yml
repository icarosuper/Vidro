name: Processor

on:
  push:
    branches: [master]
    paths:
      - "VidroProcessor/**"
      - "contracts/**"
      - ".github/workflows/processor.yml"
  pull_request:
    paths:
      - "VidroProcessor/**"
      - "contracts/**"
      - ".github/workflows/processor.yml"

defaults:
  run:
    working-directory: VidroProcessor

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Most pipeline-step tests skip themselves without it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build
        run: go build ./...

      # golangci-lint carrega o .golangci.yml do VidroProcessor: substitui os passos
      # separados de gofmt e go vet (govet está no conjunto `standard`, e os formatters
      # gofumpt/goimports são mais estritos que o gofmt).
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
          working-directory: VidroProcessor

      # Integration tests use testcontainers; Docker is available on the runner.
      - name: Test
        run: go test ./... -cover -timeout 15m
